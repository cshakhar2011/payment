services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  payment-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/paymentdb
      DATABASE_USERNAME: payment
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-payment123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081/realms/payment}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-RAZORPAY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      LOCAL_SECURITY_PERMIT: ${LOCAL_SECURITY_PERMIT:-true}
    ports:
      - "8092:8092"

volumes:
  postgres_data:
