spring:
  application:
    name: payment-service


  datasource:
    url: jdbc:postgresql://localhost:5432/payment
    username: postgres
    password: root

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8081/realms/payment}

server:
  port: 8092

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

payment:
  provider:
    name: ${PAYMENT_PROVIDER:RAZORPAY}
    key-id: {key}
    key-secret: {key}
    webhook-secret: {key}

app:
  security:
    local-permit: ${LOCAL_SECURITY_PERMIT:true}
